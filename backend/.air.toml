root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/main"
  cmd = "go build -gcflags='all=-N -l' -o tmp/main ./cmd/"
  pre_cmd = ["pkill -9 dlv 2>/dev/null; true"]
  full_bin = "dlv exec tmp/main --headless --listen=:4000 --api-version=2 --accept-multiclient --continue"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  log = "/tmp/build-errors.log"
  stop_on_error = false
  kill_delay = "2s"

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  level = "debug"

[misc]
  clean_on_exit = true
